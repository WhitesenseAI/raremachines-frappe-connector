[project]
name = "raremachines"
authors = [
    { name = "Whitefield Labs", email = "contact@whitesense.in"}
]
description = "Operate your Frappe CRM from WhatsApp chat"
# Must match the framework, not just this app's own syntax needs: Frappe v16
# declares `requires-python = ">=3.14,<3.15"` and uses PEP 695 `type X = ...`
# aliases, which do not parse below 3.12. So every bench running v16 is on 3.14
# by construction, and a looser pin here would only advertise support for
# interpreters the framework cannot itself be installed on. (Verified by
# relaxing it to >=3.11 and watching CI fail installing frappe, not this app.)
requires-python = ">=3.14"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["license.txt"]
keywords = ["frappe", "crm", "whatsapp", "raremachines", "erpnext"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Frappe",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[project.urls]
Homepage = "https://whitesense.in"
Source = "https://github.com/WhitesenseAI/raremachines-frappe-connector"
Issues = "https://github.com/WhitesenseAI/raremachines-frappe-connector/issues"
Support = "https://whitesense.in/support"
Privacy = "https://whitesense.in/privacy"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud reads this to decide which benches this app may be added to.
# Without it, adding the app fails with "Could not find compatible Frappe
# version in pyproject.toml file".
# https://docs.frappe.io/cloud/benches/custom-app
#
# `-dev` on the lower bound is deliberate: Frappe's develop builds version
# themselves as `16.0.0-dev`, which sorts BELOW `16.0.0`, so a bare `>=16.0.0`
# would exclude the very benches this app targets.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
